<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Portal | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Glowing Background Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #3b82f6;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(50px, 50px) scale(1.1);
            }
        }

        /* Glassmorphic Container */
        .container {
            position: relative;
            z-index: 10;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            padding: 48px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #d1d5db;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            background: rgba(0, 0, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .toggle {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .toggle span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s;
        }

        .toggle span:hover {
            color: #a78bfa;
            text-decoration: underline;
        }

        #error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }
    </style>
</head>

<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container" id="role-selector">
        <h2 style="text-align: center; margin-bottom: 8px;">Portal Access</h2>
        <p class="subtitle" style="text-align: center; margin-bottom: 32px;">Select your role to join the session</p>

        <div style="display: flex; flex-direction: column; gap: 16px;">
            <button onclick="selectRole('participant')"
                style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-card); padding: 24px;">
                <div style="font-size: 18px; color: var(--text-main);">JOIN AS PARTICIPANT</div>
                <div style="font-size: 12px; color: var(--text-muted); font-weight: 400; margin-top: 4px;">Ask
                    questions, take polls, and follow live</div>
            </button>
            <button onclick="selectRole('organizer')"
                style="background: rgba(139, 92, 246, 0.1); border: 1px solid var(--primary); padding: 24px;">
                <div style="font-size: 18px; color: var(--primary);">JOIN AS ORGANIZER</div>
                <div style="font-size: 12px; color: var(--text-muted); font-weight: 400; margin-top: 4px;">Host
                    sessions, push tasks, and moderate Q&A</div>
            </button>
        </div>
    </div>

    <div class="container" id="auth-container" style="display: none;">
        <div style="margin-bottom: 24px; cursor: pointer; color: var(--primary); font-size: 13px;"
            onclick="selectRole(null)">
            ← BACK TO ALL ROLES
        </div>
        <h2 id="form-title">Join Drone Workshop</h2>
        <p class="subtitle" id="form-subtitle">Create an account to participate in live Q&A</p>

        <div id="error-msg"></div>

        <form id="auth-form">
            <div class="form-group" id="name-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="E.g. Jane Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@university.edu">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Create a secure password">
            </div>
            <button type="submit" id="submit-btn">Sign Up & Connect</button>
        </form>

        <div class="toggle">
            <p id="toggle-text">Already registered? <span onclick="toggleMode()">Log in here</span></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let isLoginMode = false;
        let selectedRole = null;
        const roleSelector = document.getElementById('role-selector');
        const authContainer = document.getElementById('auth-container');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const nameGroup = document.getElementById('name-group');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const errorMsg = document.getElementById('error-msg');

        function selectRole(role) {
            selectedRole = role;
            if (role === 'organizer') {
                isLoginMode = true; // Use login mode for password check
                roleSelector.style.display = 'none';
                authContainer.style.display = 'block';
                toggleMode(true);
            } else if (role === 'participant') {
                roleSelector.style.display = 'none';
                authContainer.style.display = 'block';
                toggleMode(false);
            } else {
                roleSelector.style.display = 'block';
                authContainer.style.display = 'none';
            }
        }

        function toggleMode(forceOrganizer = false) {
            errorMsg.style.display = 'none';

            if (selectedRole === 'organizer' || forceOrganizer) {
                formTitle.innerText = "Organizer Access";
                formSubtitle.innerText = "Enter the shared secret to access the fleet command";
                nameGroup.style.display = 'none';
                document.getElementById('email').parentNode.style.display = 'none'; // Hide email for org
                document.getElementById('password').placeholder = "Enter Fleet Secret";
                submitBtn.innerText = "Authorize & Enter";
                toggleText.style.display = 'none';
                return;
            }

            // Normal participant toggle
            isLoginMode = !isLoginMode;
            document.getElementById('email').parentNode.style.display = 'block';
            toggleText.style.display = 'block';

            if (isLoginMode) {
                formTitle.innerText = "Welcome Back";
                formSubtitle.innerText = "Log in to join the live session";
                nameGroup.style.display = 'none';
                submitBtn.innerText = "Log In to Session";
                toggleText.innerHTML = 'Need an account? <span onclick="toggleMode()">Sign up here</span>';
            } else {
                formTitle.innerText = "Join Drone Workshop";
                formSubtitle.innerText = "Create an account to participate in live Q&A";
                nameGroup.style.display = 'block';
                submitBtn.innerText = "Sign Up & Connect";
                toggleText.innerHTML = 'Already registered? <span onclick="toggleMode()">Log in here</span>';
            }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "Authenticating...";
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            if (selectedRole === 'organizer') {
                try {
                    const response = await fetch(`${API_CONFIG.BASE_URL}/organizer_login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        localStorage.setItem('org_token', data.token);
                        authContainer.style.opacity = '0';
                        setTimeout(() => window.location.href = "organizer.html", 400);
                    } else {
                        throw new Error(data.detail);
                    }
                } catch (err) {
                    errorMsg.innerText = err.message || "Invalid Fleet Secret.";
                    errorMsg.style.display = 'block';
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }
                return;
            }

            const endpoint = isLoginMode ? '/login' : '/signup';
            const payload = isLoginMode ? { email, password } : { name, email, password };

            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user_name', data.name);

                    // Smooth transition to dashboard
                    authContainer.style.opacity = '0';
                    authContainer.style.transform = 'translateY(-20px)';
                    authContainer.style.transition = 'all 0.4s ease';

                    setTimeout(() => {
                        const ws = new WebSocket(`${API_CONFIG.WS_URL}/ws/participant?token=${data.access_token}`);
                        window.location.href = "participant.html";
                    }, 400);
                } else {
                    errorMsg.innerText = data.detail || "Authentication missed. Check your credentials.";
                    errorMsg.style.display = 'block';
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorMsg.innerText = "Server offline. Ensure the backend is running.";
                errorMsg.style.display = 'block';
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
