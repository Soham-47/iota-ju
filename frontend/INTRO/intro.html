<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOTA Club - Intro</title>
    <link rel="icon" type="image/png" href="/frontend/HOME/homepage-of-iota-main/images/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .splash-screen {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
    </style>

    <link rel="stylesheet" href="/frontend/loading-screen.css">
  </head>
<body>
    <div class="splash-screen">
        <video id="introVideo" autoplay muted>
            <source src="/frontend/INTRO/IOTA_intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        const video = document.getElementById("introVideo");

        video.addEventListener("ended", () => {
            sessionStorage.setItem("introShown", "1");
            window.location.href = "/home";
 // Redirect to home page after video ends
        });
    </script>

    <script src="/frontend/loading-screen.js"></script>
  </body>
</html>
