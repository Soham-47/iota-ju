<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Test</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        .test-button {
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .test-button:hover {
            transform: scale(1.1);
            background: #45a049;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        .test-button:active {
            transform: scale(0.95);
        }
    </style>

    
    <style>
        /* Loader Styles */
        .app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        
        .app-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-box {
            text-align: center;
            color: white;
        }
        
        .loader-logo {
            width: 150px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .progress-track {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 0 auto 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0;
            background: #3498db;
            transition: width 0.3s ease-out;
        }
        
        .progress-text {
            font-size: 14px;
            color: #aaa;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        body.is-loading {
            overflow: hidden;
            height: 100vh;
        }
    </style>
    </head>
<body>
    <button class="test-button">HOVER OVER ME</button>
    
    <script>
        // Add click event for additional feedback
        document.querySelector('.test-button').addEventListener('click', function() {
            alert('Button clicked! Hover effects should be working.');
        });
    </script>

            <script src="assets/js/loader.js"></script>
</body>
</html>
