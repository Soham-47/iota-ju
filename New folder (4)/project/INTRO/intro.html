<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOTA Club - Intro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .splash-screen {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>

    
    <style>
        /* Loader Styles */
        .app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        
        .app-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-box {
            text-align: center;
            color: white;
        }
        
        .loader-logo {
            width: 150px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .progress-track {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 0 auto 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0;
            background: #3498db;
            transition: width 0.3s ease-out;
        }
        
        .progress-text {
            font-size: 14px;
            color: #aaa;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        body.is-loading {
            overflow: hidden;
            height: 100vh;
        }
    </style>
    </head>
<body>
    <div class="splash-screen">
        <video id="introVideo" autoplay muted>
            <source src="IOTA_intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        const video = document.getElementById("introVideo");

        video.addEventListener("ended", () => {
            window.location.href = "../HOME/homepage-of-iota-main/home.html";
 // Redirect to home page after video ends
        });
    </script>

            <script src="assets/js/loader.js"></script>
</body>
</html>
