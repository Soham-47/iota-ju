<!DOCTYPE html>
<!-- 
    IOTA Official Website - Main Entry Point
    =====================================
    This is the main entry point for the IOTA website.
    It handles the initial loading screen and redirects to either:
    1. The intro video (for first-time visitors)
    2. The main homepage (for returning visitors)
    
    Last Updated: 2025-09-16
-->
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IOTA - Official Website">
    <title>IOTA - Loading...</title>
    
    <!-- Loader CSS -->
    <link rel="stylesheet" href="assets/css/loader.css">
    
    <!-- Base Styles -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }
        
        /* Ensure the loader is visible when loading */
        html.is-loading .app-loader {
            display: flex !important;
        }
    </style>
</head>
<body>
    <!-- Loader will be injected by loader.js -->
    
    <!-- JavaScript Files -->
    <script src="assets/js/loader.js" defer></script>
    
    <!-- Application Initialization -->
    <script>
        /**
         * Initialize the application when the DOM is fully loaded
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Check if the user has seen the intro before using session storage
            const hasSeenIntro = sessionStorage.getItem('introShown');
            
            // Small delay to ensure loading screen is properly initialized
            setTimeout(() => {
                // Redirect based on whether the user has seen the intro
                if (hasSeenIntro) {
                    // For returning visitors, go directly to the home page
                    window.location.href = 'HOME/homepage-of-iota-main/home.html';
                } else {
                    // For first-time visitors, show the intro video
                    window.location.href = 'intro-video.html';
                }
            }, 100); // 100ms delay to ensure smooth transition
        });
    </script>
</body>
</html>
