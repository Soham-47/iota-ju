<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOTA - Welcome</title>
    <link rel="stylesheet" href="./assets/css/loader.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Montserrat', sans-serif;
        }
        
        #intro-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            object-fit: cover;
        }
        
        .skip-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            outline: none;
            opacity: 0;
            animation: fadeIn 2s ease 2s forwards;
        }
        
        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .video-fallback {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: white;
            z-index: 0;
            text-align: center;
            padding: 20px;
        }
        
        .video-fallback a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            display: inline-block;
        }
    </style>

    <style>
        /* Loader Styles */
        .app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        
        .app-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-box {
            text-align: center;
            color: white;
        }
        
        .loader-logo {
            width: 150px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .progress-track {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 0 auto 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0;
            background: #3498db;
            transition: width 0.3s ease-out;
        }
        
        .progress-text {
            font-size: 14px;
            color: #aaa;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        body.is-loading {
            overflow: hidden;
            height: 100vh;
        }
    </style>
    </head>
<body>
    <video id="intro-video" autoplay muted playsinline>
        <source src="INTRO/IOTA_intro.mp4" type="video/mp4">
        <div class="video-fallback">
            <div>
                <h2>Welcome to IOTA</h2>
                <p>Your browser doesn't support the video tag. Please update your browser or skip to the website.</p>
                <a href="HOME/homepage-of-iota-main/home.html">Enter Website</a>
            </div>
        </div>
    </video>
    <button class="skip-btn" id="skipBtn">Skip Intro</button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('intro-video');
            const skipBtn = document.getElementById('skipBtn');
            const hasWatchedIntro = sessionStorage.getItem('introShown');

            // If user has already watched the intro, redirect to home
            if (hasWatchedIntro) {
                window.location.href = 'HOME/homepage-of-iota-main/home.html';
                return;
            }

            // When video ends, set flag and redirect to home
            video.addEventListener('ended', function() {
                sessionStorage.setItem('introShown', 'true');
                window.location.href = 'HOME/homepage-of-iota-main/home.html';
            });

            // Skip intro function
            skipBtn.addEventListener('click', function() {
                video.pause();
                sessionStorage.setItem('introShown', 'true');
                window.location.href = 'HOME/homepage-of-iota-main/home.html';
            });

            // Handle video loading error
            video.addEventListener('error', function() {
                console.error('Error loading video, redirecting to home page');
                sessionStorage.setItem('introShown', 'true');
                window.location.href = 'HOME/homepage-of-iota-main/home.html';
            });

            // Make sure video starts playing (some browsers require user interaction)
            const playVideo = () => {
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn('Video autoplay prevented, showing fallback');
                        document.querySelector('.video-fallback').style.display = 'flex';
                        
                        // Add click-to-play functionality
                        document.body.addEventListener('click', function startVideo() {
                            video.play();
                            document.body.removeEventListener('click', startVideo);
                        }, { once: true });
                    });
                }
            };
            
            // Try to play when page loads
            playVideo();
            
            // Also try to play when the video becomes visible (for mobile)
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    playVideo();
                }
            }, { threshold: 0.5 });
            observer.observe(video);
        });
    </script>
</body>
</html>
