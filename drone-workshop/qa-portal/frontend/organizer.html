<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Portal | Drone Workshop</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --bg-card: #111111;
            --border: #222222;
            --text-main: #f0f0f0;
            --text-dim: #888888;
            --accent: #E5FF00;
            /* Volt yellow highlight */
            --accent-gradient: #E5FF00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        .nav-logo,
        .stat-value,
        .chat-header {
            font-family: 'Outfit', sans-serif;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: #000000;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            letter-spacing: -0.5px;
        }

        .admin-tag {
            background: var(--border);
            color: var(--text-main);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 24px 32px;
            background: #0a0a0a;
            border-bottom: 1px solid var(--border);
        }

        .stat-card {
            background: #000000;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        /* Main Workspace Overlay */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 320px minmax(auto, 900px) 350px;
            justify-content: center;
            overflow: hidden;
        }

        /* Sidebar: Questions */
        .sidebar {
            background: #000000;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .question-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .question-card {
            background: #0a0a0a;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .question-card:hover {
            border-color: #555;
            background: #111;
        }

        .question-card.active {
            border-color: var(--accent);
            background: #111;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .card-sender {
            color: var(--text-main);
        }

        .replied-badge {
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        /* Workspace Area */
        .workspace {
            padding: 40px;
            display: flex;
            flex-direction: column;
            background: #000000;
        }

        .reply-pane {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: none;
        }

        .reply-pane.visible {
            display: block;
        }

        .selected-question-box {
            background: #0a0a0a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .reply-editor {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .live-chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: #000;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 250px;
        }

        .chat-msg {
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 6px;
            background: #111;
            border: 1px solid var(--border);
        }

        .chat-msg.org {
            border-color: var(--accent);
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--text-main);
        }

        .broadcast-btn {
            background: var(--text-main);
            color: #000;
            padding: 16px 32px;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            border: none;
            cursor: pointer;
            align-self: flex-end;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .broadcast-btn:hover {
            background: #fff;
        }

        /* Right Panel: Controls & Announcements */
        .controls-panel {
            background: #0a0a0a;
            border-left: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-secondary {
            background: #111;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-secondary:hover {
            background: #222;
        }

        .cfg-input {
            padding: 12px 14px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            outline: none;
            font-size: 13px;
            font-family: inherit;
        }

        .cfg-input:focus {
            border-color: #555;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-dim);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            opacity: 0.1;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-logo">IOTA DRONE WORKSHOP</div>
        <div class="admin-tag">ORGANIZER UI</div>
        <div
            style="font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; font-weight:600;">
            <div style="width: 8px; height: 8px; background: var(--accent); border-radius: 50%;"></div>
            SYSTEM ONLINE
        </div>
    </nav>

    <div class="stats-bar">
        <div class="stat-card">
            <span class="stat-label">Connected</span>
            <span class="stat-value" id="stats-connected">124</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Total Questions</span>
            <span class="stat-value" id="stats-total">42</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Answered</span>
            <span class="stat-value" id="stats-answered">38</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Avg. Response</span>
            <span class="stat-value">2.4m</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span style="font-weight: 700; font-size: 14px;">QUESTION QUEUE</span>
                <span
                    style="font-size: 11px; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 10px;">Filter:
                    Newest</span>
            </div>
            <div class="question-list" id="question-list">
                <!-- Question cards -->
            </div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="live-chat-panel">
                <div class="chat-header">Live Chat Flow</div>
                <div class="chat-messages" id="live-chat">
                    <!-- Global chat stream appears here -->
                </div>
            </div>

            <div id="empty-state" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path
                        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <h2 style="color: white; margin-bottom: 8px; font-size:16px;">No Question Selected</h2>
                <p style="font-size:13px;">Pick a question from the queue below to reply directly.</p>
            </div>

            <div id="reply-pane" class="reply-pane" style="display:none;">
                <div class="selected-question-box" style="padding: 24px; margin-bottom: 16px; border-radius:16px;">
                    <div style="font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px;"
                        id="selected-sender">FROM: JOHN DOE</div>
                    <div style="font-size: 18px; font-weight: 600; line-height: 1.4;" id="selected-text">...</div>
                </div>

                <div class="reply-editor">
                    <textarea id="reply-input" placeholder="Draft your professional response..."></textarea>
                    <button class="broadcast-btn" onclick="sendReply()">Broadcast Answer</button>
                    <button class="btn-secondary" onclick="closeReplyPane()" style="text-align:center;">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="controls-panel">
            <div class="control-group">
                <div class="stat-label">Session State Setup</div>
                <input type="text" id="cfg-title" class="cfg-input" placeholder="Session Title">
                <input type="text" id="cfg-desc" class="cfg-input" placeholder="Session Description">
                <input type="text" id="cfg-speaker" class="cfg-input" placeholder="Speaker Name (e.g. Dr. Bob)">
                <div style="display:flex; gap:8px;">
                    <input type="number" id="cfg-modules-done" class="cfg-input" placeholder="Modules Done"
                        style="flex:1;">
                    <input type="number" id="cfg-modules-total" class="cfg-input" placeholder="Total Modules"
                        style="flex:1;">
                </div>
                <button class="btn-secondary" style="border-color:var(--accent); color:var(--accent);"
                    onclick="pushState()">Push UI Update</button>
            </div>

            <div class="control-group">
                <div class="stat-label">Broadcast Announcement</div>
                <input type="text" id="ann-title" placeholder="Announcement Title" class="cfg-input">
                <input type="text" id="ann-text" placeholder="Short description..." class="cfg-input">
                <button class="btn-secondary" onclick="pushAnnouncement()">Send Announcement</button>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://localhost:8000/ws/organizer`);
        const questionList = document.getElementById("question-list");
        const emptyState = document.getElementById("empty-state");
        const replyPane = document.getElementById("reply-pane");
        const selectedSender = document.getElementById("selected-sender");
        const selectedText = document.getElementById("selected-text");
        const replyInput = document.getElementById("reply-input");
        const liveChat = document.getElementById("live-chat");

        const qMap = new Map();
        let activeQuestion = null;
        let announcements = [];

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'message') {
                if (data.role === 'participant') {
                    addQuestionToSidebar(data);
                    appendLiveChat(`<b>${data.name}:</b> ${data.text}`, false);
                    if (data.reply) {
                        appendLiveChat(`<b>ORGANIZER (to ${data.name}):</b> ${data.reply}`, true);
                    }
                } else if (data.role === 'organizer') {
                    appendLiveChat(`<b>ORGANIZER:</b> ${data.text}`, true);
                    if (data.question_id) markAsReplied(data.question_id);
                }
            } else if (data.type === 'state_update') {
                // Populate forms
                document.getElementById('cfg-title').value = data.session_title || '';
                document.getElementById('cfg-desc').value = data.session_desc || '';
                document.getElementById('cfg-speaker').value = data.speaker_name || '';
                document.getElementById('cfg-modules-done').value = data.modules_completed || 0;
                document.getElementById('cfg-modules-total').value = data.total_modules || 6;
                announcements = data.announcements || [];
            } else if (data.type === 'stats_update') {
                document.getElementById('stats-connected').innerText = data.participants;
            }
        };

        function appendLiveChat(html, isOrg) {
            const div = document.createElement("div");
            div.className = "chat-msg" + (isOrg ? " org" : "");
            div.innerHTML = html;
            liveChat.appendChild(div);
            liveChat.scrollTop = liveChat.scrollHeight;
        }

        function addQuestionToSidebar(data) {
            if (qMap.has(data.id)) return;
            qMap.set(data.id, data);

            const card = document.createElement("div");
            card.className = "question-card";
            card.id = `q-${data.id}`;

            card.innerHTML = `
                <div class="card-meta">
                    <span class="card-sender">${data.name.toUpperCase()}</span>
                    ${data.reply ? '<span class="replied-badge">Replied</span>' : ''}
                </div>
                <div style="font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                    ${data.text}
                </div>
            `;

            card.onclick = () => {
                document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');

                activeQuestion = data;
                emptyState.style.display = 'none';
                replyPane.style.display = 'block';
                selectedSender.innerText = `FROM: ${data.name.toUpperCase()}`;
                selectedText.innerText = data.text;
                replyInput.focus();
            };

            questionList.prepend(card);
            updateStats();
        }

        function closeReplyPane() {
            emptyState.style.display = 'flex';
            replyPane.style.display = 'none';
            activeQuestion = null;
            document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
        }

        function markAsReplied(qId) {
            const card = document.getElementById(`q-${qId}`);
            if (card && !card.querySelector('.replied-badge')) {
                card.querySelector('.card-meta').insertAdjacentHTML('beforeend', '<span class="replied-badge">Replied</span>');
            }
            updateStats();
        }

        function updateStats() {
            document.getElementById('stats-total').innerText = qMap.size;
            const answered = Array.from(qMap.values()).filter(q => q.reply).length;
            document.getElementById('stats-answered').innerText = answered;
        }

        function sendReply() {
            const text = replyInput.value.trim();
            if (!text || !activeQuestion) return;

            // Optimistic update of local state so stats increment
            const q = qMap.get(activeQuestion.id);
            if (q) q.reply = text;

            ws.send(JSON.stringify({
                type: "reply",
                text: text,
                question_id: activeQuestion.id
            }));

            replyInput.value = "";
            closeReplyPane();
        }

        function pushState() {
            ws.send(JSON.stringify({
                type: "update_state",
                session_title: document.getElementById('cfg-title').value,
                session_desc: document.getElementById('cfg-desc').value,
                speaker_name: document.getElementById('cfg-speaker').value,
                modules_completed: document.getElementById('cfg-modules-done').value,
                total_modules: document.getElementById('cfg-modules-total').value
            }));
            alert("UI State Pushed to Participants!");
        }

        function pushAnnouncement() {
            const title = document.getElementById('ann-title').value.trim();
            const text = document.getElementById('ann-text').value.trim();
            if (!title || !text) return;

            announcements.unshift({ title, text }); // add to top
            // Keep max 5 for UI clarity (optional)

            ws.send(JSON.stringify({
                type: "update_state",
                announcements: announcements
            }));

            document.getElementById('ann-title').value = '';
            document.getElementById('ann-text').value = '';
            alert("Announcement Broadcasted!");
        }
    </script>
</body>


</html>
