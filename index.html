<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOTA - Loading...</title>
    <link rel="stylesheet" href="loading-screen.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Loading screen will be injected by loading-screen.js -->
    
    <script src="loading-screen.js"></script>
    <script>
        // Initialize loading screen immediately
        document.addEventListener('DOMContentLoaded', () => {
            // Check if the user has seen the intro before
            const hasSeenIntro = sessionStorage.getItem('introShown');
            
            // Redirect after a small delay to allow loading screen to initialize
            setTimeout(() => {
                if (hasSeenIntro) {
                    window.location.href = 'HOME/homepage-of-iota-main/home.html';
                } else {
                    window.location.href = 'intro-video.html';
                }
            }, 100);
        });
    </script>
</body>
</html>
